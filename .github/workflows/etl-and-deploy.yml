name: ETL Pipeline + Quality Gate

on:
  # 每週一 09:00 UTC 自動執行
  schedule:
    - cron: "0 9 * * 1"
  # 手動觸發
  workflow_dispatch:
    inputs:
      skip_quality_gate:
        description: "Skip quality gate (emergency deploy)"
        type: boolean
        default: false

concurrency:
  group: etl-and-deploy
  cancel-in-progress: false

jobs:
  # ── Job 1: ETL ─────────────────────────────────────────────────────────────
  etl:
    name: ETL Pipeline
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch from Notion (incremental)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
        run: python scripts/01_fetch_notion.py

      # 外部文章為補充資料源（核心資料迴路是 Notion→extract→dedupe→Supabase），
      # 來源網站擋爬蟲屬可預期情況，故 best-effort 不阻斷 pipeline；
      # Medium 需 Playwright（且 bot 偵測擋 CI IP），維持本地執行 01b
      - name: Fetch external articles (iThome + Google Cases, best-effort)
        run: python scripts/run_pipeline.py --step fetch-articles
        continue-on-error: true

      - name: Extract Q&A (OpenAI)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LMNR_PROJECT_API_KEY: ${{ secrets.LMNR_PROJECT_API_KEY }}
        run: python scripts/02_extract_qa.py

      - name: Deduplicate + Classify
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/03_dedupe_classify.py

      # 結構與向量對齊檢查，不取代後續的內容／檢索品質評估。
      - name: Validate candidate artifacts before upload
        run: python scripts/migrate_to_supabase.py --dry-run

      - name: Upload artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: qa-output
          path: |
            output/qa_final.json
            output/qa_enriched.json
            output/qa_embeddings.npy
            output/qa_embeddings_index.json
            output/qa_embeddings_manifest.json
          retention-days: 7

  # ── Job 2: Migrate to Supabase ─────────────────────────────────────────────
  migrate:
    name: Migrate to Supabase
    needs: etl
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: qa-output
          path: output/

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Migrate to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/migrate_to_supabase.py

  # ── Job 3: Eval + Quality Gate ─────────────────────────────────────────────
  eval:
    name: Eval + Quality Gate
    needs: migrate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: qa-output
          path: output/

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run data quality eval
        env:
          LMNR_PROJECT_API_KEY: ${{ secrets.LMNR_PROJECT_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python scripts/_eval_data_quality.py --source supabase

      - name: Run retrieval eval
        env:
          LMNR_PROJECT_API_KEY: ${{ secrets.LMNR_PROJECT_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python scripts/_eval_laminar.py --source supabase --group keyword-retrieval

      - name: Quality Gate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ "${{ inputs.skip_quality_gate }}" = "true" ]; then
            echo "Quality gate skipped (emergency deploy)"
            python scripts/quality_gate.py --source supabase --dry-run
          else
            python scripts/quality_gate.py --source supabase
          fi
