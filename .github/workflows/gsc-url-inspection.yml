name: GSC URL Inspection Sampling

# 每日用 URL Inspection API 對抽樣 URL 查索引狀態，寫進 Supabase gsc_url_inspection。
# 抽樣三層優先序（對照組固定不變／零曝光舊頁／零曝光新頁）與配額守門的設計理由，
# 見 scripts/ingest_gsc_url_inspection.py 的模組 docstring。
#
# 與 gsc-search-analytics.yml 刻意分開：來源 API、配額模型（2,000 QPD 而非 50,000
# rows/day）、抽樣邏輯完全不同，合併只會讓判讀互相干擾（同 gsc-search-analytics.yml
# 對 cwv-*.yml 的理由）。

on:
  schedule:
    - cron: '40 7 * * *'   # 每日 07:40 UTC，錯開 gsc-search-analytics（07:20）避免同時
                           # 打 Supabase；兩者查詢的是不同 property 配額（Search Analytics
                           # 與 URL Inspection 各自獨立計數），不互搶 GSC 端配額。
  workflow_dispatch:
    inputs:
      sample_size:
        description: '本次最多查幾個 URL（1-500）'
        required: false
        default: '100'
      quota_budget:
        description: '24 小時滾動配額自我上限（1-2000）'
        required: false
        default: '500'

# 同時只跑一個，避免排程與手動觸發互相覆寫配額分類帳的計算基準。不取消進行中的那個
# ——它可能正在寫入，取消會留下 status='running' 的孤兒列（同 gsc-search-analytics.yml
# 的理由）。
concurrency:
  group: gsc-url-inspection
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        # google-auth 負責 service account 的 RS256 JWT 簽章與 token 交換；
        # defusedxml 用來安全解析 vocus.cc 的 sitemap（遠端 XML，擋 XXE／billion-laughs）。
        run: pip install python-dotenv google-auth defusedxml requests

      - name: Sample-inspect GSC URLs
        env:
          # service account 的 JSON **字串**，不是檔案路徑——金鑰不落磁碟。與
          # gsc-search-analytics.yml 共用同一把唯讀 SA（gsc-readonly@vocus-seo-ops）。
          GSC_READONLY_KEY: ${{ secrets.GSC_READONLY_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # 經 env 傳遞而非直接內插進 run:——workflow_dispatch 的 input 是使用者輸入，
          # 內插進 shell 等於命令注入面（同 gsc-search-analytics.yml 的理由）。
          # 腳本自己也會再驗一次值域（resolve_sample_size / resolve_quota_budget）。
          SAMPLE_SIZE: ${{ github.event.inputs.sample_size || '100' }}
          QUOTA_BUDGET: ${{ github.event.inputs.quota_budget || '500' }}
        run: |
          python scripts/ingest_gsc_url_inspection.py \
            --execute --sample-size "$SAMPLE_SIZE" --quota-budget "$QUOTA_BUDGET"

      - name: Verify last write
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/ingest_gsc_url_inspection.py --verify

  # 資料新鮮度告警。條件是「gsc_url_inspection 最新 inspected_at 太舊」，不是「ingest
  # job 有沒有失敗」——理由同 gsc-search-analytics.yml：排程根本沒被觸發時不會產生任何
  # 失敗事件。needs: 刻意不設——ingest 掛掉時這個 job 仍要跑，它本來就是為了涵蓋
  # 「ingest 沒有回報任何東西」的情況。
  #
  # 門檻見腳本 FRESHNESS_MAX_AGE_HOURS（96h）：inspect 沒有 search analytics 那種
  # 固有延遲，但配額可能被 gsc-sitemap-ops 或其他呼叫方擠占導致連續數天零寫入
  # （仍是「成功」的 run），門檻因此抓得比單純「排程週期 × 2」更寬。
  freshness:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install python-dotenv

      - name: Check gsc_url_inspection freshness
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/ingest_gsc_url_inspection.py --check-freshness
