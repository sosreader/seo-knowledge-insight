name: CWV CrUX History Ingestion

# 每週把 CrUX History API 的 vocus.cc 週序列（origin 級 + 代表 URL 級）寫進 Supabase
# cwv_hourly（source='crux'）。CrUX 本身每週更新一次，排程週頻對齊；upsert 冪等，
# 提早或延後跑都不會造成重複或遺漏——即使漏跑一整週，下次執行仍會用
# collectionPeriodCount=40 把最近 40 週全部重新覆蓋一次。
#
# 與 cwv-hourly.yml（RUM，逐小時）刻意分成兩個 workflow：granularity 不同、
# 排程週期不同、來源系統不同（Loki vs Google CrUX API），合併只會讓兩種失敗模式
# 互相干擾判讀。

on:
  schedule:
    - cron: '0 6 * * 2'   # 每週二 06:00 UTC；CrUX 資料集慣例於週初更新，實際發布日
                          # 若飄移也不影響正確性——upsert 冪等，只是該週資料晚一點到位
  workflow_dispatch:
    inputs:
      collection_period_count:
        description: '回溯週數（1-40）'
        required: false
        default: '40'
      origin_only:
        description: '只抓 origin 級，跳過 URL 級（省配額）'
        required: false
        default: 'false'
        type: boolean

# 同時只跑一個，避免排程與手動回填互相覆寫。不取消進行中的那個——
# 它可能正在寫入，取消會留下 status='running' 的孤兒列（同 cwv-hourly.yml 的理由）。
concurrency:
  group: cwv-crux-history
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install python-dotenv

      - name: Ingest CrUX history
        env:
          CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # 經 env 傳遞而非直接內插進 run:——workflow_dispatch 的 input 是使用者輸入，
          # 內插進 shell 等於命令注入面（同 cwv-hourly.yml 的理由）。腳本自己也會再驗一次上限。
          COLLECTION_PERIOD_COUNT: ${{ github.event.inputs.collection_period_count || '40' }}
          ORIGIN_ONLY: ${{ github.event.inputs.origin_only || 'false' }}
        run: |
          ARGS="--execute --collection-period-count $COLLECTION_PERIOD_COUNT"
          if [ "$ORIGIN_ONLY" = "true" ]; then
            ARGS="$ARGS --origin-only"
          fi
          python scripts/ingest_cwv_crux_history.py $ARGS

      - name: Verify last write
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/ingest_cwv_crux_history.py --verify

  # 資料新鮮度告警。條件是「cwv_hourly (source=crux) 最近一筆超過門檻」，不是
  # 「ingest job 有沒有失敗」——理由同 cwv-hourly.yml：排程根本沒被觸發時不會有
  # 任何失敗事件，只有資料本身的缺席能證明作業沒在跑。
  #
  # needs: [ingest] + if: always()——2026-09-03 修正。原本跟其他四條管線一樣
  # 完全不設 needs（兩個 job 平行起跑），理由是「ingest 掛掉時 freshness 仍要跑」；
  # 但平行起跑同時製造了一個競態：實測 run 33710475866，freshness 的 gap 檢查在
  # 03:11:52 讀到資料庫，ingest 到 03:12:07 才把這次要寫的那一週（2026-08-24）
  # 寫完——freshness 讀到的是「ingest 還沒寫完」的舊狀態，把這次 run 自己正在
  # 寫的那一週誤判成 gap FAIL。對每小時管線這個窗口很短、又有 lag_buffer_hours
  # 蓋著所以沒暴露；CrUX 是週頻、ingest 要跑 15~20s，幾乎每次成功執行都會中，
  # 等於「一個永遠在叫的告警」——跟 S3.5 想根除的東西一樣糟。
  #
  # 光加 needs: ingest（不加 if）不是正確修法：那樣 ingest 失敗時 freshness
  # 會被 skip，複製 gsc-url-inspection.yml 註解提到的 S2.2 病灶（新鮮度告警
  # 住在它要監控的作業裡，看不到自己的缺席）。needs 只保證「順序」，
  # if: always() 才保證「不管 ingest 成功或失敗都會跑」——兩個一起加，
  # 才是「讀到的一定是 ingest 這次執行後的最終狀態」而不是「讀到的一定是
  # ingest 成功後的狀態」。這樣不會把真陽性蓋掉：ingest 真的失敗時，
  # 資料庫在 freshness 檢查的當下確實還是缺那一週，gap FAIL 照樣正確觸發，
  # 只是現在的觸發時機是「ingest 這次嘗試已經有結果」而不是「兩個 job
  # 剛好同時起跑的任意時間點」。也不會退化「workflow 整個沒被觸發」的涵蓋
  # 範圍——那個情境現在由獨立於本 workflow 排程的 data-quality-watchdog.yml
  # 負責（兩個 job 一起不存在，needs 本來就管不到這一層）。
  # regression test 見 tests/test_workflow_job_ordering.py。
  #
  # S3.5：改走統一資料品質 gate（scripts/data_quality_gate.py --pipeline
  # cwv_hourly_crux），取代原本的 ingest_cwv_crux_history.py --check-freshness。
  # 這是 S3.5 修的缺陷 1 本身——cwv_hourly 這張表同時裝著 RUM 與 CrUX 兩條管線，
  # 舊的逐腳本檢查各自查各自的 source 篩選，看起來沒錯，但 ingestion_run 裡兩者
  # 共用 table_name='cwv_hourly' 無法單獨查詢；統一 gate 額外補上空段檢查
  # （逐週掃描，見 quality_gate_config.py），能在新鮮度門檻（480h）觸發前就先
  # 抓到「這一週該有資料卻沒有」。
  freshness:
    runs-on: ubuntu-latest
    needs: ingest
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install python-dotenv

      - name: Check cwv_hourly_crux quality (freshness / gap / degradation)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/data_quality_gate.py --pipeline cwv_hourly_crux

      - name: Check for stale running ingestion_run rows (global)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/data_quality_gate.py --check stale-running
