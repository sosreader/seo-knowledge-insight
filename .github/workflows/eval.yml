name: Laminar Eval

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# retrieval／meeting-prep structure／grounding／report quality 的 run_eval() 在 `if __name__ == "__main__"`
# 底下，`lmnr eval <file>` 只匯入模組（log 為 `Loaded 0 evaluations`），門檻閘門不會執行，
# 所以這四步直接用 python 執行。extraction 為模組層級 evaluate()，維持 `lmnr eval`。
jobs:
  eval:
    name: Offline evals (retrieval + extraction + meeting-prep)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run retrieval eval
        env:
          LMNR_PROJECT_API_KEY: ${{ secrets.LMNR_PROJECT_API_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.RAG_EVAL_CF_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.RAG_EVAL_CF_CLIENT_SECRET }}
        # 打線上 rag-api（RAG_API_BASE 預設 https://warehouse-api.vocus.cc/internal/rag），
        # POST /search 不帶 mode，線上無 LLM 時自動走 keyword。
        # 憑證缺失或 rag-api 不可達時 eval 以 ::warning:: 標記並 skip（exit 0），不讓 workflow 紅
        run: python evals/eval_retrieval.py

      - name: Run extraction eval
        env:
          LMNR_PROJECT_API_KEY: ${{ secrets.LMNR_PROJECT_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        # LLM 分項：線上 rag-api 未啟用 LLM，extraction 需要本地 output/qa_per_meeting/，
        # CI 無此資料，graceful skip (exit 0)；chat／chat_maturity 在 llm_disabled 501 時同樣 skip，
        # 完整 LLM 分數改在本機 Mac 以 Ollama 跑（RAG_API_BASE=http://localhost:8080）
        run: lmnr eval evals/eval_extraction.py

      - name: Run meeting-prep structure eval
        env:
          LMNR_PROJECT_API_KEY: ${{ secrets.LMNR_PROJECT_API_KEY }}
        # 純 file-based，fixtures committed 至 eval/fixtures/meeting_prep/
        run: python evals/eval_meeting_prep_structure.py

      - name: Run meeting-prep grounding eval
        env:
          LMNR_PROJECT_API_KEY: ${{ secrets.LMNR_PROJECT_API_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.RAG_EVAL_CF_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.RAG_EVAL_CF_CLIENT_SECRET }}
        # 讀取 fixtures + KB lookup（本地 qa_final.json → rag-api GET /qa/{id}）；
        # rag-api 不可用時 gate 以 ::warning:: skip
        run: python evals/eval_meeting_prep_grounding.py

      - name: Run report quality eval
        env:
          LMNR_PROJECT_API_KEY: ${{ secrets.LMNR_PROJECT_API_KEY }}
        # 純 file-based，fixtures committed 至 eval/fixtures/reports/
        run: python evals/eval_report_quality.py
