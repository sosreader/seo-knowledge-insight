name: CWV Hourly Ingestion

# 每小時把 Loki 的 web-vitals RUM 聚合寫進 Supabase cwv_hourly。
#
# 為什麼不能漏跑：來源 Loki 的 retention_period 只有 168h（7 天）。這個作業安靜停擺
# 超過 7 天，那段 CWV 序列就永久遺失且事後無法回填——compactor 已經把來源刪掉了。
# 所以下面有兩個 job：ingest 負責寫，freshness 負責在 ingest 完全沒被觸發時叫出來。

on:
  schedule:
    - cron: '5 * * * *'   # 每小時第 5 分鐘，讓上一個小時確定收完
  workflow_dispatch:
    inputs:
      backfill_hours:
        description: '回填最近 N 個完整小時（上限 48）'
        required: false
        default: '2'

# 同時只跑一個，避免排程與手動回填互相覆寫。不取消進行中的那個——
# 它可能正在寫入，取消會留下 status='running' 的孤兒列。
concurrency:
  group: cwv-hourly
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install python-dotenv

      - name: Ingest CWV hourly
        env:
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
          GRAFANA_SERVICE_ACCOUNT_TOKEN: ${{ secrets.GRAFANA_SERVICE_ACCOUNT_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # 經 env 傳遞而非直接內插進 run:——workflow_dispatch 的 input 是使用者輸入，
          # 內插進 shell 等於命令注入面。腳本自己也會再驗一次上限 48。
          BACKFILL_HOURS: ${{ github.event.inputs.backfill_hours || '2' }}
        run: |
          python scripts/ingest_cwv_hourly.py --execute --backfill-hours "$BACKFILL_HOURS"

      - name: Verify last write
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/ingest_cwv_hourly.py --verify

  # 資料新鮮度告警。
  #
  # S3.5：統一資料品質 gate（scripts/data_quality_gate.py），涵蓋新鮮度／空段／
  # 靜默降級三類，取代原本只做新鮮度的 ingest_cwv_hourly.py --check-freshness。
  # 條件刻意是「cwv_hourly（source=rum）最近一筆資料超過門檻」，不是「ingest job
  # 有沒有失敗」——排程根本沒被觸發時（cron 語法錯、GitHub 因 repo 閒置自動停用
  # schedule、有人手動關掉忘了開回來）不會產生任何失敗事件，失敗型告警在那種情況
  # 下是靜音的。只有資料本身的缺席能證明作業沒在跑。
  #
  # needs: [ingest] + if: always()——2026-09-03 修正，理由與細節見
  # cwv-crux-history.yml 同一段註解：完全不設 needs 會讓 freshness 與 ingest
  # 平行起跑，可能讀到 ingest 還沒寫完的資料庫（在 CrUX 那條週頻管線上實測
  # 幾乎每次都中，此處是同一個架構的預防性修正，hourly 週期短、目前尚未
  # 觀察到實際觸發，但風險同構）。needs 保證順序，if: always() 保證
  # ingest 失敗時 freshness 仍會跑（不會複製「新鮮度告警住在自己要監控的
  # 作業裡看不到自己缺席」的病灶）；「workflow 整個沒被觸發」的涵蓋範圍
  # 由獨立排程的 data-quality-watchdog.yml 負責，needs 管不到那一層也不需要管。
  freshness:
    runs-on: ubuntu-latest
    needs: ingest
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install python-dotenv

      - name: Check cwv_hourly_rum quality (freshness / gap / degradation)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/data_quality_gate.py --pipeline cwv_hourly_rum

      # 全域檢查（跨管線共用同一張 ingestion_run），刻意獨立成一個 step 且 if: always()——
      # 上一步失敗時這步仍要跑，job 才不會因為單一 pipeline 的問題而漏查殘留 running。
      - name: Check for stale running ingestion_run rows (global)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/data_quality_gate.py --check stale-running
