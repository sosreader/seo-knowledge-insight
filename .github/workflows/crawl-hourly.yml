name: Crawl Hourly Ingestion

# 每 6 小時把 Loki 的 envoy access log 聚合成 crawler 流量分佈寫進 Supabase crawl_daily。
# 「每 6 小時」指的是抓取頻率；寫進去的資料粒度仍然是**逐小時**的桶——降頻不會少掉
# 任何一小時的資料點，改變的只有「最新一筆有多新」：剛跑完仍是 <=2h，但下一輪之前
# 最壞會到 9.36h（降頻前是 4.36h）。這個數字就是新鮮度門檻取 10h 的依據，
# 逐項推導見 scripts/ingest_crawl_hourly.py 的 FRESHNESS_MAX_AGE_HOURS 註解。
#
# 為什麼不能漏跑：來源 Loki 的 retention_period 只有 168h（7 天）。這個作業安靜停擺
# 超過 7 天，那段 crawler 序列就永久遺失且事後無法回填——compactor 已經把來源刪掉了。
# 而且這份資料**沒有第二個來源**：Search Console API v1 沒有 Crawl Stats resource，
# GSC 介面上那份「檢索統計」抓不下來，而且它只涵蓋 Googlebot，
# AI crawler（實測佔 crawler 流量的 54%）在 GSC 裡完全看不到。
#
# 所以 ingest job 尾端接了一組資料品質 gate step（2026-09-10 之前是獨立的 freshness
# job，為了消掉逐 job 計費的整分鐘進位稅而併入，語意逐條對照見該段註解）；
# 「排程整個沒被觸發」這一層由獨立排程的 data-quality-watchdog.yml 負責。

on:
  schedule:
    # 每 6 小時的第 5 分鐘（00:05 / 06:05 / 12:05 / 18:05 UTC）。
    # 2026-09-10 由每小時降頻而來，三個選擇各有理由：
    #
    # 【為什麼是 6 小時】視窗 W 要能容忍完整漏跑一次，需 W >= floor(2F+D)+1；
    #   W 受 MAX_BACKFILL_HOURS=24 上限，反推 F <= 11。取 6 留一倍餘裕。
    #   完整推導在 scripts/ingest_crawl_hourly.py 的 DEFAULT_LOOKBACK_HOURS 註解。
    #
    # 【為什麼是 0/6/12/18 這組整點】其他組都會撞到既有的每日排程：
    #   1,7,13,19 撞 gsc-search-analytics（07:20，實測跑 30 分鐘）
    #   2,8,14,20 撞 update-freshness（週一 02:00）與 gsc-url-inspection（08:20）
    #   3,9,15,21 撞 data-quality-watchdog（09:30）與週一 etl-and-deploy（09:00）
    #   4,10,16,22 / 5,11,17,23 撞週一 etl-and-deploy 的尾巴（跑到約 10:44）
    #   0,6,12,18 只在週二 06:00 與 cwv-crux-history 相鄰，而後者約 36 秒、
    #   寫的是另一張表（cwv_hourly）、來源是 CrUX API 不是 Loki——降頻前每小時
    #   都會發生的相鄰，不是新增的風險。
    #
    # 【為什麼放在第 5 分、比 cwv-hourly（第 35 分）早】兩者查同一個 Loki，
    #   降頻後視窗從 2h 變 14h、單次掃描量跟著變大，錯開的必要性比降頻前更高。
    #   本管線是長的那個（W=14 約 634s ≈ 10.6 分鐘；envoy stream 單小時 113MB），
    #   排在前面才能在最壞延遲（+44 分，即 06:49 起跑、約 07:00 結束）下仍然
    #   趕在 gsc-search-analytics（07:20）之前收工。cwv 那支中位僅 14 秒，
    #   排在第 35 分綽綽有餘。名目間隔 30 分鐘，遠寬於降頻前的 10 分鐘。
    - cron: '5 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      backfill_hours:
        description: '回填最近 N 個完整小時（上限 24；每小時約 37 秒）'
        required: false
        default: '14'
      backfill_until:
        description: >-
          選填。視窗新端的 ISO 時間（例如 2026-09-01T21:00:00Z），
          用來錨定補一個已知的舊缺口——backfill_hours 永遠錨定在「現在」，
          單靠它構不到超過 24h 前的洞。留空則沿用現有行為（錨定在現在）。
        required: false
        default: ''

# 同時只跑一個，避免排程與手動回填互相覆寫。不取消進行中的那個——
# 它可能正在 upsert，取消會留下 status='running' 的孤兒列，
# 而且中斷在 upsert 與 sweep_stale 之間會留下該小時的過期殘列。
concurrency:
  group: crawl-hourly
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install python-dotenv

      - name: Ingest crawl hourly
        env:
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
          GRAFANA_SERVICE_ACCOUNT_TOKEN: ${{ secrets.GRAFANA_SERVICE_ACCOUNT_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # 經 env 傳遞而非直接內插進 run:——workflow_dispatch 的 input 是使用者輸入，
          # 內插進 shell 等於命令注入面。腳本自己也會再驗一次上限 24。
          BACKFILL_HOURS: ${{ github.event.inputs.backfill_hours || '14' }}
          BACKFILL_UNTIL: ${{ github.event.inputs.backfill_until || '' }}
        run: |
          if [ -n "$BACKFILL_UNTIL" ]; then
            python scripts/ingest_crawl_hourly.py --execute \
              --backfill-hours "$BACKFILL_HOURS" --backfill-until "$BACKFILL_UNTIL"
          else
            python scripts/ingest_crawl_hourly.py --execute --backfill-hours "$BACKFILL_HOURS"
          fi

      - name: Verify last write
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/ingest_crawl_hourly.py --verify

      # ── 資料品質 gate（2026-09-10 由獨立的 freshness job 併入本 job）──────────
      #
      # 為什麼併：GitHub Actions 逐 job 計費，每個 job 各自無條件進位到整分鐘。
      # 實測 2026-09-02..09-08 一週，這條 gate 的 job 中位數只有 8~22 秒卻各收
      # 整整 1 分鐘——cwv-hourly 一週真實計算 71.6 分鐘、計費 334 分鐘（4.66x）。
      # 併成同 job 的 step 之後這一分鐘不再重複計。
      #
      # 原本兩個 job 的分工逐條對照，確認沒有語意損失：
      #   needs: ingest        → 同 job 的後續 step，順序天然保證（原本要消掉的
      #                          「讀到 ingest 還沒寫完的資料庫」競態一樣被消掉）
      #   job 級 if: always()  → step 級 if: always()，語意相同：ingest 步驟失敗時
      #                          這幾步照樣跑，不會複製「新鮮度告警住在它要監控的
      #                          作業裡、看不到自己缺席」的病灶（S2.2）
      #   事件類型篩選          → 原樣保留在每個 step 的 if 條件裡
      #   「workflow 整個沒被觸發」→ 本來就不歸這裡管，由獨立排程的
      #                          data-quality-watchdog.yml 負責，不受影響
      #
      # 唯一真正損失的覆蓋：runner 在 ingest 途中整個死掉（OOM／硬取消／基礎設施
      # 故障）時，獨立 job 仍會被排上、合併後的 step 不會。實測該週 437 個 run 中
      # 此類事件 0 次，且 data-quality-watchdog 每日一次已涵蓋（最遲 24h 發現，
      # Loki 168h 保留期下仍有 144h 可用 --backfill-until 補回）。
      #
      # regression test 見 tests/test_workflow_job_ordering.py。
      #
      # ── 以下為原 freshness job 的註解，原樣保留（提到的 needs／job 級 if 指的是
      #    併入之前的形狀，理由本身仍然成立）───────────────────────────────────
      # 資料新鮮度告警。
      #
      # 條件刻意是「crawl_daily 最近一筆資料超過 3 小時」，不是「ingest job 有沒有失敗」——
      # 排程根本沒被觸發時（cron 語法錯、GitHub 因 repo 閒置自動停用 schedule、有人手動
      # 關掉忘了開回來）不會產生任何失敗事件，失敗型告警在那種情況下是靜音的。
      # 只有資料本身的缺席能證明作業沒在跑。
      #
      # 健康時這個條件不成立（正常每小時都有新資料），所以它是告警不是指標——
      # 每次都會成立的條件屬於儀表板，放在這裡只會訓練大家忽略它。
      #
      # needs: [ingest] + if: always()——2026-09-03 修正，理由與細節見
      # cwv-crux-history.yml 同一段註解：完全不設 needs 會讓 freshness 與 ingest
      # 平行起跑，可能讀到 ingest 還沒寫完的資料庫（在 CrUX 那條週頻管線上實測
      # 幾乎每次都中，此處是同一個架構的預防性修正，hourly 週期短、目前尚未
      # 觀察到實際觸發，但風險同構）。needs 保證順序，if: always() 保證
      # ingest 失敗時 freshness 仍會跑；「workflow 整個沒被觸發」的涵蓋範圍
      # 由獨立排程的 data-quality-watchdog.yml 負責。
      #
      # S3.5：統一資料品質 gate（scripts/data_quality_gate.py），涵蓋新鮮度／空段／
      # 靜默降級三類，取代原本只做新鮮度的 ingest_crawl_hourly.py --check-freshness。

      - name: Check crawl_daily quality (freshness / gap / degradation)
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/data_quality_gate.py --pipeline crawl_daily

      - name: Check for stale running ingestion_run rows (global)
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/data_quality_gate.py --check stale-running
