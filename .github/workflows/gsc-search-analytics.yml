name: GSC Search Analytics Ingestion

# 每日把 GSC Search Analytics API 的逐日資料寫進 Supabase gsc_daily_metrics（無排名的
# googleNews 只有 date+page+device 一套維度組合；discover 因 device 維度本身不支援，
# 改用不帶 device 的 date+page（page_nodevice）一套；有排名的 web／image／video／news
# 另加 date+query+device）；同一次探測查詢的副產品（全站總數）另寫進 gsc_daily_totals。
#
# ingest job 用 matrix 依序（max-parallel: 1）跑六個 surface：web／news／googleNews／
# discover／image／video。排程（schedule）事件固定跑全部六個；手動觸發
# （workflow_dispatch）只跑 input 指定的那一個。
#
# image／video 是 2026-09-04 起加入——S3.6 一致性驗證發現這兩個 surface 從未進
# warehouse（scripts/gsc_surfaces.py 的 SURFACE_COMBOS 早就支援，只差排程沒排進去），
# 兩格因此不可比。加入後兩者維度組合與 web 相同（page＋query 都有），走既有的
# gsc_daily_metrics 品質門檻（見 scripts/quality_gate_config.py 新增的 gsc_image／
# gsc_video 條目）。
#
# 為什麼要每次回補最近 7 天而不是只抓昨天：
#   1. GSC 資料延遲通常 2-3 天，只抓昨天大多會抓到空的
#   2. 同一個日期的數字在後續幾天會被 Google 回溯修訂，只抓一次會定格在最早的版本
# 腳本會先用一次便宜的 dimensions=["date"] 探測查詢，問出「目前實際有資料的日期」，
# 再從中取最近 N 天——所以延遲飄到 4-5 天也不會誤報。探測回看天數（probe_days）
# 同時是 backfill_days 的上限：只探測了 N 天，就只能確認 N 天內有沒有資料可回填。
#
# 與 cwv-*.yml 刻意分開：來源系統、排程週期、失敗模式都不同，合併只會讓判讀互相干擾。

on:
  schedule:
    - cron: '20 7 * * *'   # 每日 07:20 UTC。GSC 沒有固定發布時刻，排程時間不影響
                           # 正確性——upsert 冪等，且探測會自己決定抓哪幾天。
  workflow_dispatch:
    inputs:
      backfill_days:
        description: '回補最近 N 天，1–500，需 ≤ probe_days'
        required: false
        default: '7'
      probe_days:
        description: '探測回看 N 天，1–500；>14 才能回填 >14 天'
        required: false
        default: '14'
      search_type:
        description: 'search type（web/image/video/news/googleNews/discover）'
        required: false
        default: 'web'
      dry_run:
        description: '只查 API 不寫庫；用來探測維度支援'
        required: false
        default: 'false'

# 同時只跑一個，避免排程與手動回填互相覆寫。不取消進行中的那個——
# 它可能正在寫入，取消會留下 status='running' 的孤兒列（同 cwv-hourly.yml 的理由）。
concurrency:
  group: gsc-search-analytics
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    strategy:
      # schedule 事件跑全部六個 surface；workflow_dispatch 只跑 input 指定的那一個
      # （fromJSON 依事件切換，見下方 matrix.search_type 表達式）。max-parallel: 1——
      # 六個 surface 共用同一個 Supabase 連線與同一張 ingestion_run 表，序列執行
      # 讓每個 surface 的 run 紀錄與 log 互不交錯，也避免對 GSC API 同時發出多筆請求。
      max-parallel: 1
      # fail-fast: false——六個 surface 互不依賴，一個失敗不該取消排在後面的其他幾個。
      # 2026-09-04 07:30 UTC 排程：image 的 verify 撞 statement timeout，video 因預設
      # fail-fast=true 被連帶 cancelled，當天完全沒跑到；freshness gate 會各自報。
      fail-fast: false
      matrix:
        search_type: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.event.inputs.search_type || 'web')) || fromJSON('["web", "news", "googleNews", "discover", "image", "video"]') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        # google-auth 負責 service account 的 RS256 JWT 簽章與 token 交換；
        # 它的 transport.requests 需要 requests。API 呼叫本身仍走 stdlib urllib。
        run: pip install python-dotenv google-auth requests

      - name: Ingest GSC search analytics
        env:
          # service account 的 JSON **字串**，不是檔案路徑——金鑰不落磁碟。
          GSC_READONLY_KEY: ${{ secrets.GSC_READONLY_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # 經 env 傳遞而非直接內插進 run:——workflow_dispatch 的 input 是使用者輸入，
          # 內插進 shell 等於命令注入面（同 cwv-hourly.yml 的理由）。腳本自己也會再驗一次值域。
          # schedule 事件固定 probe_days=14／backfill_days=7；workflow_dispatch 吃使用者輸入。
          BACKFILL_DAYS: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.backfill_days || '7') || '7' }}
          PROBE_DAYS: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.probe_days || '14') || '14' }}
          SEARCH_TYPE: ${{ matrix.search_type }}
          # dry_run 只在 workflow_dispatch 有意義；schedule 事件恆為 --execute。
          MODE_FLAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' && '--dry-run' || '--execute' }}
        run: |
          python scripts/ingest_gsc_search_analytics.py \
            "$MODE_FLAG" --backfill-days "$BACKFILL_DAYS" --probe-days "$PROBE_DAYS" --search-type "$SEARCH_TYPE"

      - name: Verify last write
        # dry-run 沒有寫庫，驗證上一輪的舊資料沒有意義，跳過。
        if: github.event.inputs.dry_run != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SEARCH_TYPE: ${{ matrix.search_type }}
        run: python scripts/ingest_gsc_search_analytics.py --verify --search-type "$SEARCH_TYPE"

  # 資料新鮮度告警。條件是「gsc_daily_metrics 最新資料日期太舊」，不是「ingest job
  # 有沒有失敗」——排程根本沒被觸發時（cron 語法錯、GitHub 因 repo 閒置自動停用
  # schedule、有人手動關掉忘了開回來）不會產生任何失敗事件，失敗型告警在那種情況下
  # 是靜音的。只有資料本身的缺席能證明作業沒在跑。
  #
  # needs: [ingest] + if: always()——2026-09-03 修正，理由與細節見
  # cwv-crux-history.yml 同一段註解：完全不設 needs 會讓 freshness 與 ingest
  # 平行起跑，可能讀到 ingest 還沒寫完的資料庫（在 CrUX 那條週頻管線上實測
  # 幾乎每次都中，此處是同一個架構的預防性修正，daily 週期短、目前尚未
  # 觀察到實際觸發，但風險同構）。needs 保證順序，if: always() 保證
  # ingest 失敗時 freshness 仍會跑；「workflow 整個沒被觸發」的涵蓋範圍
  # 由獨立排程的 data-quality-watchdog.yml 負責。
  #
  # 門檻 144h = GSC 固有延遲上限 96h + 排程週期緩衝 48h，**不是**「排程週期 × N」。
  # GSC 的 max(date) 天生就落後現在 2-4 天，用 24h × 3 = 72h 會對健康資料誤報。
  #
  # S3.5：統一資料品質 gate（scripts/data_quality_gate.py），涵蓋新鮮度／空段兩類
  # （靜默降級為已知缺口，見 quality_gate_config.py 的 degradation_skip_reason），
  # 取代原本只做新鮮度的 ingest_gsc_search_analytics.py --check-freshness。
  # 查詢一律走視圖 gsc_page_daily（見 quality_gate_config.py 註解），不查底表。
  freshness:
    runs-on: ubuntu-latest
    needs: ingest
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install python-dotenv

      - name: Check gsc_daily_metrics quality (freshness / gap)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/data_quality_gate.py --pipeline gsc_daily_metrics

      # 各條各自獨立跑（if: always()）——六個 surface pipeline 互不依賴，
      # 一個 FAIL 不該蓋掉其他幾個的結果，同 stale-running 步驟的理由。
      - name: Check gsc_googlenews quality (freshness / gap)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/data_quality_gate.py --pipeline gsc_googlenews

      - name: Check gsc_discover quality (freshness / gap)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/data_quality_gate.py --pipeline gsc_discover

      # 2026-09-04 S2.4 新增：discover page 層（page_nodevice 組）另立的新鮮度訊號，
      # 與上面 gsc_discover（totals）是兩個母體、兩條寫入路徑，各自要能看到停擺。
      - name: Check gsc_discover_pages quality
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/data_quality_gate.py --pipeline gsc_discover_pages

      # 2026-09-04 新增：image／video 併入排程後補的兩條 gate，理由同 gsc_googlenews——
      # gsc_daily_metrics（不帶 filter）新鮮/空段檢查看到 web 每天在寫就會綠燈，
      # 蓋掉 image／video 自己停擺的訊號，必須各自獨立檢查。
      - name: Check gsc_image quality (freshness / gap)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/data_quality_gate.py --pipeline gsc_image

      - name: Check gsc_video quality (freshness / gap)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/data_quality_gate.py --pipeline gsc_video

      - name: Check gsc_daily_totals quality (freshness / gap)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/data_quality_gate.py --pipeline gsc_daily_totals

      - name: Check for stale running ingestion_run rows (global)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/data_quality_gate.py --check stale-running
