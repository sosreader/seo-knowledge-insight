services:
  seo-api-ts:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    volumes:
      # output volume only needed in file-based mode (no VW_DB_SECRET_FILE_RAG).
      # PG mode: mount the db-rag secret JSON and set VW_DB_SECRET_FILE_RAG to its path.
      - ./output:/app/output:ro
      - ./scripts:/app/scripts:ro
    environment:
      - NODE_ENV=development
      - PORT=8002
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001
      - SEO_API_KEY=
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LMNR_PROJECT_API_KEY=${LMNR_PROJECT_API_KEY:-}
      - VW_DB_SECRET_FILE_RAG=${VW_DB_SECRET_FILE_RAG:-}
    restart: unless-stopped
